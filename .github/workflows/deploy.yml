name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # Security rules are the only backend and this workflow deploys them, so
      # they're tested against the emulator before anything ships.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm install -g firebase-tools@15

      - run: npm run test:rules

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    # id-token lets the job sign in to Google Cloud without a stored key
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      # Keyless: GitHub's OIDC token is exchanged for short-lived credentials
      # for github-deploy@, which can only deploy hosting and rules. The trust
      # only accepts this repo (by numeric id) on main. No long-lived key.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/386582948349/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deploy@wrenchtron-db057.iam.gserviceaccount.com

      - run: npm install -g firebase-tools@15

      - name: Deploy hosting
        run: firebase deploy --only hosting --project wrenchtron-db057 --non-interactive

      # One target per step so a failure says which one. No continue-on-error:
      # a rules deploy that fails must fail the run, not pass silently.
      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project wrenchtron-db057 --non-interactive

      - name: Deploy Storage rules
        run: firebase deploy --only storage --project wrenchtron-db057 --non-interactive

  # Post-deploy gate: drive synthetic golden-signal traffic at the live URL and
  # confirm the telemetry landed in the watchtron control plane (black-box —
  # availability, p95 and route coverage). No-ops if the secrets aren't set yet.
  watchtron-verify:
    needs: build-and-deploy
    uses: swantron/watchtron/.github/workflows/verify.yml@main
    with:
      service: wrenchtron
    secrets:
      otlp_endpoint: ${{ secrets.WATCHTRON_OTLP_ENDPOINT }}
      token: ${{ secrets.WATCHTRON_TOKEN }}
